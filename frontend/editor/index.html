<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <link rel="icon" href="modern-logo/favicon.ico" sizes="32x32" />
    <link rel="icon" href="modern-logo/favicon.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="A free, private PDF editor you can run on any infrastructure."
    />
    <link rel="apple-touch-icon" href="modern-logo/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />

    <title>INTEGRA PDF</title>

    <!-- Apply the theme before first paint (no FOUC). INTEGRA is always dark;
         must match ThemeProvider. -->
    <script>
      (function () {
        var r = document.documentElement;
        r.setAttribute("data-theme", "dark");
        r.setAttribute("data-app-theme", "custom");
        r.setAttribute("data-accent", "default");
        r.setAttribute("data-mantine-color-scheme", "dark");
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="src/index.tsx"></script>
  </body>
</html>
