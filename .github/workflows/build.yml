# Builds the INTEGRA PDF image and pushes it to GHCR, in the same shape as the
# RailObserver build. Runs on GitHub's runners, never a self-hosted one: this
# repository is public, and a self-hosted runner would let any pull request
# from any fork execute code on the home network.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/m4rv1n33/stirling-pdf
          # The sha tag is what an environment is pinned to; latest is what the
          # server polls for. Both move on every push to main.
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # The Dockerfile writes VERSION_TAG to /etc/stirling_version and the image
      # label; without it both read "dev". Taken from build.gradle so no JDK is
      # needed on the runner just to print it.
      - name: Read the app version
        id: version
        run: echo "version=$(sed -n "s/^    version = '\(.*\)'$/\1/p" build.gradle | head -n 1)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/embedded/Dockerfile
          push: true
          build-args: |
            VERSION_TAG=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
